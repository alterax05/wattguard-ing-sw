    get:
      operationId: getBuildingsByIdReadings
      summary: Get reading history
      description: Returns history for a date range, for charts. Use
        limit=1&sortOrder=desc for the latest reading
      tags:
        - Buildings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Historical readings retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBuildingHistoryResponse"
        "400":
          description: Invalid date range
          content:
            application/json:
              schema:
