              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Building not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - in: path
          name: id
          schema:
            $ref: "#/components/schemas/ObjectId"
          required: true
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          required: true
          description: Start date for historical data
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          required: true
          description: End date for historical data
        - in: query
          name: sensorType
          schema:
            type: string
            enum:
              - internal_temp
              - external_temp
              - energy_meter
              - gas_meter
          description: Filter by sensor type
        - in: query
          name: interval
          schema:
            type: string
            enum:
              - minute
              - hour
              - day
          description: "Data aggregation interval (default: hour)"
        - in: query
          name: limit
          schema:
            type: string
          description: "Maximum number of points (1-1000, default: 1000). Use
            limit=1&sortOrder=desc for the latest point"
        - in: query
          name: sortOrder
          schema:
            default: asc
            type: string
            enum:
              - asc
              - desc
          description: "Sort order by timestamp (default: asc)"
